name: merge gate (full suite)

# The merge queue's required check. The queue builds the candidate merge of a PR
# onto current main, runs the whole suite on that candidate, and fast-forwards
# main only when this is green -- so a red tree can never land. Also runs on PRs
# for early feedback and on push to main as a visible post-merge backstop.
#
# Runs on windows-latest: the suite covers Windows-only behaviour (win32 window
# handling, hidden-subprocess flags) that does not exist off-Windows. genau
# imports two sibling packages -- app_support and player_core -- installed
# editable from local paths and never published, so CI checks them out adjacent
# and installs them the same way. Every editable install uses compat mode (see
# CLAUDE.md): setuptools' default editable finder would otherwise shadow the
# repo's own genau/nau/genau_vr packages. pygame runs headless through the dummy
# SDL video driver. No libmpv is provisioned: nothing the suite imports reaches
# player_core.mpv_player, so python-mpv never loads the DLL.

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

concurrency:
  group: merge-gate-${{ github.ref }}
  cancel-in-progress: false

env:
  SDL_VIDEODRIVER: dummy

jobs:
  full-suite:
    runs-on: windows-latest
    steps:
      - name: Check out genau
        uses: actions/checkout@v4
        with:
          path: genau
      - name: Check out app_support (sibling, editable dependency)
        uses: actions/checkout@v4
        with:
          repository: haglio/app_support
          path: app_support
      - name: Check out player_core (sibling, editable dependency)
        uses: actions/checkout@v4
        with:
          repository: haglio/player_core
          path: player_core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install siblings then genau (editable, compat mode)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ./app_support --config-settings editable_mode=compat
          pip install -e ./player_core --config-settings editable_mode=compat
          pip install -e "./genau[dev,voice,vr]" --config-settings editable_mode=compat
      - name: Run the suite
        shell: bash
        working-directory: genau
        run: python -m pytest -q
