[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genau"
version = "0.1.0"
# 3.12, not 3.10: every gate in the family runs 3.12 and nothing has ever
# collected a suite on anything older, so >=3.10 was a promise no run backed.
requires-python = ">=3.12"
# The siblings are in [tool.haglio] below, not here: neither is published, so pip
# would go looking for them on PyPI. player_core brings python-mpv and the libmpv
# DLL with it — nothing in this repo imports mpv directly any more.
#
# Every requirement carries a ceiling. Without one each run installs whatever
# PyPI served that morning, which is how this family's gates came to run a major
# version of the imaging stack past the one the machines have. Floors are what
# this repo's venv holds today.
dependencies = [
    "numpy>=2.4,<3",
    "pillow>=12,<13",
    "pygame-ce>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "pytest-timeout>=2.4,<3",
    "ruff==0.16.6",
    "vulture>=2.16,<3",
]

# Two top-level app packages share this repo; setuptools' automatic
# flat-layout discovery refuses that, so declare them explicitly. Fun Time
# launches `python -m genau` / `python -m nau` from this venv without a
# working directory, so all of them must ship in the (editable) install.
# The family checkouts this one is installed beside. Two, not three: the merge
# gate cloned and installed shared_ui as well, and nothing in this repo imports
# a shared_ui module -- a clone and a Qt wheel on every run, and a dependency to
# anyone deciding what may safely change. tests/test_dependencies.py holds this
# list against the tree both ways, so neither half can drift again.
[tool.haglio]
siblings = ["app_support", "player_core"]

[tool.setuptools.packages.find]
include = ["genau*", "nau*"]

[tool.pytest.ini_options]
# A ceiling on a hang, not a performance budget. The slowest test on a
# developer machine is the tracked-tree content scan, but it is not the
# slowest on a runner: it returns early when no blocklist is reachable, and
# the blocklist is git-ignored, so a fresh checkout has none. What CI does run
# longest here are the tests that spawn a child interpreter to import a
# package the way a launcher would -- a few seconds each on a cold Windows
# runner. 240 s also leaves the 180 s child guard in tests/test_win32.py
# reachable, so it fails with its own message. --timeout-method=thread is the
# half that pays for itself: it dumps the stack of the test that stopped, which
# turns a stalled required check into a one-line diagnosis.
# tests/test_timeouts.py holds all three halves of it.
addopts = "-p no:cacheprovider --timeout=240 --timeout-method=thread -p app_support.sanitize.pytest_plugin"
testpaths = ["tests"]
