[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genau"
version = "0.1.0"
requires-python = ">=3.10"
# player_core is NOT listed here: it is installed editable from ../player_core
# (see its README) and is not published, so pip would go looking for it on PyPI.
# It brings python-mpv and the libmpv DLL with it — nothing in this repo imports
# mpv directly any more.
dependencies = [
    "numpy",
    "pillow",
    "pygame-ce",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-timeout",
    "ruff==0.16.6",
    "vulture",
]

# Two top-level app packages share this repo; setuptools' automatic
# flat-layout discovery refuses that, so declare them explicitly. Fun Time
# launches `python -m genau` / `python -m nau` from this venv without a
# working directory, so all of them must ship in the (editable) install.
[tool.setuptools.packages.find]
include = ["genau*", "nau*"]

[tool.pytest.ini_options]
# A ceiling on a hang, not a performance budget. The slowest test on a
# developer machine is the tracked-tree content scan, but it is not the
# slowest on a runner: it returns early when no blocklist is reachable, and
# the blocklist is git-ignored, so a fresh checkout has none. What CI does run
# longest here are the tests that spawn a child interpreter to import a
# package the way a launcher would -- a few seconds each on a cold Windows
# runner. 240 s also leaves the 180 s child guard in tests/test_win32.py
# reachable, so it fails with its own message. --timeout-method=thread is the
# half that pays for itself: it dumps the hung stack, which turns a stalled
# required check into a one-line diagnosis. tests/test_timeouts.py holds all
# three halves of it.
addopts = "-p no:cacheprovider --timeout=240 --timeout-method=thread -p app_support.sanitize.pytest_plugin"
testpaths = ["tests"]
