[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genau"
version = "0.1.0"
# The version every gate runs, and the one the family's machine runs: a floor
# lower than what a run proves is a promise nothing backs.
requires-python = ">=3.14"
# This repo ships no code of its own: it is the venv Fun Time's Main Player runs
# out of, and these are what that player imports. player_core brings python-mpv
# (its DLL lives in %USERPROFILE%\.haglio\libmpv), numpy and pillow with it.
#
# Every requirement carries a ceiling. Without one each run installs whatever
# PyPI served that morning, which is how this family's gates came to run a major
# version of the imaging stack past the one the machines have.
# The family repos this venv holds are named at the tags the Main Player was
# built against rather than left to be whatever checkouts sit beside it.
# Unpinned, a change landing in one of them reached every consumer the same
# minute, and one whose other half had not landed turned all of them red at
# once. Moving to a newer one is this repo's own commit.
dependencies = [
    "app-support @ git+https://github.com/haglio/app_support@v0.1.182",
    "player-core @ git+https://github.com/haglio/player_core@v0.1.417",
    "shared-ui @ git+https://github.com/haglio/shared_ui@v0.1.159",
    "pygame-ce>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "pytest-timeout>=2.4,<3",
    "ruff==0.16.6",
]

# The family checkouts this venv is installed beside, every one pinned above.
# tests/test_dependencies.py holds this list against the tree both ways, counting
# what a declared sibling needs in turn. None is published, so none can go in
# [project.dependencies] by name alone.
[tool.haglio]
siblings = ["app_support", "player_core", "shared_ui"]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
# A ceiling on a hang, not a performance budget; tests/test_timeouts.py holds all
# three halves of it. --timeout-method=thread dumps the stack of the test that
# stopped, which turns a stalled required check into a one-line diagnosis.
addopts = "-p no:cacheprovider --timeout=240 --timeout-method=thread -p app_support.sanitize.pytest_plugin"
testpaths = ["tests"]
