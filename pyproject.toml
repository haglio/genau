[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genau"
version = "0.1.0"
requires-python = ">=3.10"
# player_core is NOT listed here: it is installed editable from ../player_core
# (see its README) and is not published, so pip would go looking for it on PyPI.
# It brings python-mpv and the libmpv DLL with it — nothing in this repo imports
# mpv directly any more.
dependencies = [
    "numpy",
    "opencv-python",
    "pillow",
    "pygame-ce",
]

[project.optional-dependencies]
voice = [
    "vosk",
    "sounddevice",
]
dev = [
    "pytest",
    "pytest-timeout",
    "ruff",
    "vulture",
]
vr = [
    "pyopenxr",
    "PyOpenGL",
    "glfw",
]

# Three top-level app packages share this repo; setuptools' automatic
# flat-layout discovery refuses that, so declare them explicitly. Fun Time
# launches `python -m genau` / `python -m nau` from this venv without a
# working directory, so all of them must ship in the (editable) install.
[tool.setuptools.packages.find]
include = ["genau*", "nau*", "genau_vr*"]

[tool.pytest.ini_options]
# The timeout is a ceiling, not a target: the slowest test here is the
# tracked-tree content scan at ~14 s, so 90 s clears it six times over and can
# only bite on a hang. This suite binds real UDP sockets and joins reader
# threads, which is exactly the shape that hangs. The thread method prints the
# hung stack, which is what turns a stalled required check into a one-line
# diagnosis. tests/test_timeouts.py holds both halves of it.
addopts = "-p no:cacheprovider --timeout=90 --timeout-method=thread"
testpaths = ["tests"]
