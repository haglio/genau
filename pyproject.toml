[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genau"
version = "0.1.0"
requires-python = ">=3.10"
# player_core is NOT listed here: it is installed editable from ../player_core
# (see its README) and is not published, so pip would go looking for it on PyPI.
# It brings python-mpv and the libmpv DLL with it — nothing in this repo imports
# mpv directly any more.
dependencies = [
    "numpy",
    "opencv-python",
    "pillow",
    "pygame-ce",
]

[project.optional-dependencies]
voice = [
    "vosk",
    "sounddevice",
]
dev = [
    "pytest",
    "pytest-timeout",
    "ruff",
    "vulture",
]
vr = [
    "pyopenxr",
    "PyOpenGL",
    "glfw",
]

# Three top-level app packages share this repo; setuptools' automatic
# flat-layout discovery refuses that, so declare them explicitly. Fun Time
# launches `python -m genau` / `python -m nau` from this venv without a
# working directory, so all of them must ship in the (editable) install.
[tool.setuptools.packages.find]
include = ["genau*", "nau*", "genau_vr*"]

[tool.pytest.ini_options]
# A ceiling on a hang, not a performance budget. The slowest test on a
# developer machine is the tracked-tree content scan, but it is not the
# slowest on a runner: it returns early when no blocklist is reachable, and
# the blocklist is git-ignored, so a fresh checkout has none. What CI does run
# longest here is the two inventory tests, each spawning a child that collects
# the whole suite -- 76 modules pulling pygame, opencv, PyQt6, OpenXR and two
# siblings -- at about two seconds here and much more on a cold Windows
# runner. 240 s also leaves the 180 s child guards in tests/test_win32.py and
# tests/test_gvr_without_openxr.py reachable, so those fail with their own
# message; tools/inventory.py's 600 s guard does not, and cannot without a
# ceiling too high to be one. --timeout-method=thread is the half that pays
# for itself: it dumps the hung stack, which turns a stalled required check
# into a one-line diagnosis. tests/test_timeouts.py holds all three halves of
# it.
addopts = "-p no:cacheprovider --timeout=240 --timeout-method=thread"
testpaths = ["tests"]
