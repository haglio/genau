[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genau"
version = "0.1.0"
# 3.12, not 3.10: every gate in the family runs 3.12 and nothing has ever
# collected a suite on anything older, so >=3.10 was a promise no run backed.
requires-python = ">=3.12"
# player_core brings python-mpv with it (its DLL lives in
# %LOCALAPPDATA%\haglio\libmpv) -- nothing in this repo imports mpv directly.
#
# Every requirement carries a ceiling. Without one each run installs whatever
# PyPI served that morning, which is how this family's gates came to run a major
# version of the imaging stack past the one the machines have. Floors are what
# this repo's venv holds today.
# The family repos this one runs are named at the tags it was built against
# rather than left to be whatever checkouts sit beside it. Unpinned, a change
# landing in one of them reached every consumer the same minute, and one whose
# other half had not landed turned all of them red at once. Moving to a newer
# one is this repo's own commit, with its own suite to answer for it.
dependencies = [
    "app-support @ git+https://github.com/haglio/app_support@v0.1.140",
    "player-core @ git+https://github.com/haglio/player_core@v0.1.260",
    "shared-ui @ git+https://github.com/haglio/shared_ui@v0.1.123",
    "numpy>=2.4,<3",
    "pillow>=12,<13",
    "pygame-ce>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "pytest-timeout>=2.4,<3",
    "ruff==0.16.6",
    "vulture>=2.16,<3",
]

# Declared rather than discovered: Fun Time launches `python -m genau` from
# this venv without a working directory, so the package must ship in the
# (editable) install.
# The family checkouts this one is installed beside. All three, though nothing
# here imports a shared_ui module: the player_core HUDs this repo does import
# are painted in the family's colors, so a checkout without shared_ui cannot
# collect a test. tests/test_dependencies.py holds this list against the tree
# both ways, counting what a declared sibling needs in turn. None is published,
# so none can go in [project.dependencies].
[tool.haglio]
siblings = ["app_support", "player_core", "shared_ui"]

[tool.setuptools.packages.find]
include = ["genau*"]

[tool.pytest.ini_options]
# A ceiling on a hang, not a performance budget. The slowest test on a
# developer machine is the tracked-tree content scan, but it is not the
# slowest on a runner: it returns early when no blocklist is reachable, and
# the blocklist is git-ignored, so a fresh checkout has none. What CI does run
# longest here are the tests that spawn a child interpreter to import a
# package the way a launcher would -- a few seconds each on a cold Windows
# runner. 240 s also leaves the 180 s child guard in tests/test_win32.py
# reachable, so it fails with its own message. --timeout-method=thread is the
# half that pays for itself: it dumps the stack of the test that stopped, which
# turns a stalled required check into a one-line diagnosis.
# tests/test_timeouts.py holds all three halves of it.
addopts = "-p no:cacheprovider --timeout=240 --timeout-method=thread -p app_support.sanitize.pytest_plugin"
testpaths = ["tests"]
